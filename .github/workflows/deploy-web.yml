name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot and Export Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.godot-bin
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-stable-official-linux

      - name: Install Godot 4.7.2 and Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          GODOT_RELEASE="4.7.2-stable"
          GODOT_VERSION="4.7.2"

          mkdir -p ~/.godot-bin
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/.godot-bin
          ln -sf ~/.godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/.godot-bin/godot
          chmod +x ~/.godot-bin/godot

          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates

      - name: Add Godot to PATH
        run: |
          chmod +x $HOME/.godot-bin/godot || true
          echo "$HOME/.godot-bin" >> $GITHUB_PATH

      - name: Verify Godot
        run: godot --version
      - name: Build Web
        run: |
          mkdir -v -p build/web
          touch build/.gdignore
          if ! grep -q "addons/mesh_baker/plugin.cfg" project.godot; then
            printf '\n[editor_plugins]\n\nenabled=PackedStringArray("res://addons/mesh_baker/plugin.cfg")\n' >> project.godot
          fi
          if ! grep -q "import/blender/enabled" project.godot; then
            printf '\n[filesystem]\n\nimport/blender/enabled=false\n' >> project.godot
          fi
          godot --headless --import
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
