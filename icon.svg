<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Asphalt -->
    <linearGradient id="bgAsphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242936"/>
      <stop offset="100%" stop-color="#11141b"/>
    </linearGradient>

    <!-- Highway Warning Sign Yellow -->
    <linearGradient id="signYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe033"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Sign Assembly Drop Shadow -->
    <filter id="signShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <clipPath id="squircleClip">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
  </defs>

  <!-- App Icon Squircle Base -->
  <g clip-path="url(#squircleClip)">
    <rect width="128" height="128" fill="url(#bgAsphalt)"/>

    <!-- Subtle Stroad Background Road Elements -->
    <!-- Top White Dashed Lane Line -->
    <line x1="0" y1="13" x2="128" y2="13" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.25"/>
    <!-- Bottom Double Solid Yellow Markings -->
    <line x1="0" y1="117" x2="128" y2="117" stroke="#f59e0b" stroke-width="2.5" opacity="0.4"/>
    <line x1="0" y1="122" x2="128" y2="122" stroke="#f59e0b" stroke-width="2.5" opacity="0.4"/>
  </g>

  <!-- Sign Assembly (Diamond + Bottom Plaque) with unified shadow -->
  <g filter="url(#signShadow)">
    <!-- 1. Diamond Warning Sign (Centered at 64, 48) -->
    <g transform="translate(64, 48)">
      <!-- 45-degree Diamond Plate -->
      <rect x="-42" y="-42" width="84" height="84" rx="9" fill="url(#signYellow)" stroke="#0f172a" stroke-width="4.5" transform="rotate(45)"/>
      <!-- Inner Inset Black Border -->
      <rect x="-36" y="-36" width="72" height="72" rx="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(45)"/>

      <!-- Mounting Bolt (Top) -->
      <circle cx="0" cy="-43" r="1.8" fill="#475569" stroke="#0f172a" stroke-width="0.8"/>

      <!-- Crosswalk Markings inside sign -->
      <g fill="#0f172a" opacity="0.85">
        <rect x="-30" y="21" width="8" height="3" rx="0.8"/>
        <rect x="-16" y="21" width="8" height="3" rx="0.8"/>
        <rect x="-2" y="21" width="8" height="3" rx="0.8"/>
        <rect x="12" y="21" width="8" height="3" rx="0.8"/>
        <rect x="26" y="21" width="8" height="3" rx="0.8"/>
      </g>

      <!-- Mega Lifted American Pickup Truck (Chasing from left) -->
      <g transform="translate(-49, -13)">
        <!-- Speed Streaks behind truck -->
        <line x1="2" y1="8" x2="9" y2="8" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <line x1="-2" y1="13" x2="7" y2="13" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="3" y1="18" x2="10" y2="18" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

        <!-- Truck Silhouette: Lifted Crew-Cab Pickup with Menacing Tall Grille -->
        <path d="M 8 15 
                 L 18 15 
                 L 22 1 
                 L 35 1 
                 L 38 9 
                 L 48 9 
                 L 48 23 
                 L 8 23 Z" fill="#0f172a"/>

        <!-- Cab Window Cutout -->
        <polygon points="23,3 34,3 36,9 20,9" fill="#f59e0b"/>

        <!-- Front Grille Slats -->
        <line x1="45" y1="11" x2="45" y2="21" stroke="#f59e0b" stroke-width="1.2"/>
        <line x1="47.2" y1="11" x2="47.2" y2="21" stroke="#f59e0b" stroke-width="1.2"/>

        <!-- Aggressive Headlight glow -->
        <polygon points="44,9 48,9 48,13 43,13" fill="#ffffff"/>

        <!-- Lifted High-Clearance Suspension / Axles -->
        <rect x="15" y="21" width="2" height="4" fill="#0f172a"/>
        <rect x="38" y="21" width="2" height="4" fill="#0f172a"/>

        <!-- Big Knobby Off-Road Tires -->
        <circle cx="16" cy="24" r="5.5" fill="#0f172a"/>
        <circle cx="16" cy="24" r="2.2" fill="#f59e0b"/>
        <circle cx="39" cy="24" r="5.5" fill="#0f172a"/>
        <circle cx="39" cy="24" r="2.2" fill="#f59e0b"/>
      </g>

      <!-- Mats (The Pedestrian Hero Sprinting for His Life!) -->
      <g transform="translate(8, -17)">
        <!-- Panic / Speed Lines -->
        <path d="M 19 -10 Q 23 -12 26 -10" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M 21 -6 Q 25 -7 27 -5" stroke="#ea580c" stroke-width="1.3" stroke-linecap="round" fill="none"/>

        <!-- Back Arm (swung backward/up) -->
        <path d="M 2 7 L -7 11 L -10 6" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="-10" cy="6" r="2" fill="#fed7aa"/>

        <!-- Green Backpack strapped to back -->
        <rect x="-6" y="4" width="7" height="12" rx="2.5" fill="#15803d" stroke="#0f172a" stroke-width="1.2" transform="rotate(-15 -2.5 10)"/>

        <!-- Back Leg (kicking up behind in full sprint) -->
        <path d="M 0 19 L -8 24 L -15 19" stroke="#1d4ed8" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- Back Foot / Shoe (angled up) -->
        <polygon points="-15,19 -20,15 -22,19 -16,22" fill="#dc2626"/>

        <!-- Torso / Orange Jacket -->
        <path d="M -2 4 L 11 4 L 8 20 L -4 20 Z" fill="#ff5722" stroke="#0f172a" stroke-width="1.2"/>
        <!-- Reflective Safety Stripe -->
        <line x1="-3" y1="12.5" x2="10" y2="12.5" stroke="#ffffff" stroke-width="2"/>

        <!-- Front Leg (high knee drive forward) -->
        <path d="M 6 19 L 14 17 L 18 27" stroke="#2563eb" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- Front Foot / Shoe (stepping down forward) -->
        <polygon points="18,27 25,27 25,31 17,31" fill="#ef4444"/>
        <line x1="17" y1="31" x2="25" y2="31" stroke="#ffffff" stroke-width="1.2"/>

        <!-- Front Arm (driving forward in run) -->
        <path d="M 9 7 L 16 9 L 21 5" stroke="#ff5722" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="21" cy="5" r="2" fill="#fed7aa"/>

        <!-- Head Circle -->
        <circle cx="5" cy="-3" r="6.5" fill="#fed7aa" stroke="#0f172a" stroke-width="1"/>
        <!-- Red Baseball Cap -->
        <path d="M -1 -4 C 0 -11, 11 -11, 12 -3 Z" fill="#dc2626"/>
        <!-- Cap Visor pointing forward -->
        <path d="M 9 -4 L 17 -3 L 12 0.5 Z" fill="#991b1b"/>
        <!-- Cute, determined, alert eye -->
        <circle cx="7.5" cy="-3" r="1.5" fill="#0f172a"/>
        <circle cx="8" cy="-3.5" r="0.6" fill="#ffffff"/>
        <!-- Determined mouth line -->
        <path d="M 6 0 Q 8 1 10 -0.5" stroke="#0f172a" stroke-width="1" fill="none" stroke-linecap="round"/>
        <!-- Sweat drop of panic/effort -->
        <path d="M 1 -7 C 0 -8, 0 -9.5, 1 -10.5 C 2 -9.5, 2 -8, 1 -7 Z" fill="#38bdf8"/>
      </g>
    </g>

    <!-- 2. Advisory Plaque (Directly Below Diamond) -->
    <g transform="translate(64, 107)">
      <!-- Plaque Body (MUTCD Yellow with Black Border) -->
      <rect x="-48" y="-9" width="96" height="18" rx="4" fill="url(#signYellow)" stroke="#0f172a" stroke-width="2.5"/>
      <rect x="-45.5" y="-6.5" width="91" height="13" rx="2.5" fill="none" stroke="#0f172a" stroke-width="1"/>

      <!-- Vectorized STROAD HERO Text (Centered ink bounds) -->
