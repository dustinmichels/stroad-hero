[tools]
uv = "latest"
oxfmt = "latest"

[tasks.fmt]
description = "Format GDScript (gdformat) and Markdown (oxfmt) files"
run = ['uvx --from "gdtoolkit==4.*" gdformat .', 'oxfmt "**/*.md"']

[tasks.test]
description = "Run Godot headless test suite or specific tests"
run = 'python3 scripts/run_tests.py "$@"'

[tasks.mats-preview]
description = "Render Mats character preview views (front, side, back, walk, kneel) to /tmp"
run = 'python3 scripts/render_mats_preview.py "$@"'


[tasks.export-web]
description = "Export the Web preset to build/web (from a /tmp copy, so the open editor's .godot/ is untouched)"
run = '''
set -eu
work=/tmp/stroad-hero-export
rsync -a --delete --exclude .git --exclude build ./ "$work/"
if ! grep -q "addons/mesh_baker/plugin.cfg" "$work/project.godot"; then
    printf '\n[editor_plugins]\n\nenabled=PackedStringArray("res://addons/mesh_baker/plugin.cfg")\n' >> "$work/project.godot"
fi
mkdir -p build/web
/Applications/Godot.app/Contents/MacOS/Godot --headless --path "$work" --export-release "Web" "$PWD/build/web/index.html"
'''

[tasks.web]
description = "Build the Web export and serve locally at http://localhost:8080"
depends = ["export-web"]
raw = true
run = "python3 -m http.server 8080 --directory build/web"
