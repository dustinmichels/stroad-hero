# =============================================================================
# TOOLS & ENVIRONMENT
# =============================================================================

[tools]
uv = "latest"
oxfmt = "latest"
# The release zip drops the executable bit.
"github:itchio/butler" = { version = "latest", postinstall = "chmod +x \"$MISE_TOOL_INSTALL_PATH/butler\"" }

[env]
ITCH_TARGET = "dustinmichels/stroad-hero"

# =============================================================================
# DEVELOPMENT
# =============================================================================

[tasks.dev]
description = "Launch the game's main scene in a Godot window (extra args pass through, e.g. --verbose)"
raw = true
run = '/Applications/Godot.app/Contents/MacOS/Godot --path . "$@"'

[tasks.fmt]
description = "Format GDScript (gdformat) and Markdown (oxfmt) files"
run = ['uvx --from "gdtoolkit==4.*" gdformat .', 'oxfmt "**/*.md"']

[tasks.mats-preview]
description = "Render Mats character preview views (front, side, back, walk, kneel) to /tmp"
run = 'python3 scripts/render_mats_preview.py "$@"'

# =============================================================================
# TESTING & BENCHMARKS
# =============================================================================

[tasks.test]
description = "Run the lean Godot test suite, extended tests, or specific flags"
run = 'python3 scripts/run_tests.py "$@"'

[tasks.bench]
description = "Run manual Godot benchmarks (gameplay benchmarks open a window)"
run = 'python3 scripts/run_tests.py --bench "$@"'

# =============================================================================
# DESKTOP EXPORT
# =============================================================================

[tasks.export-mac-pack]
description = "Export a baked macOS .pck to /tmp/stroad_mac.pck for benchmarking the shipped build (mise run bench --main-pack=/tmp/stroad_mac.pck)"
run = '''
set -eu
work=/tmp/stroad-hero-export-mac
bash scripts/prepare_export_copy.sh "$work"
/Applications/Godot.app/Contents/MacOS/Godot --headless --path "$work" --export-pack "macOS" /tmp/stroad_mac.pck
'''

[tasks.export-desktop]
description = "Export baked macOS, Windows, and Linux release builds to build/{macos,windows,linux} (from a /tmp copy)"
run = '''
set -eu
work=/tmp/stroad-hero-export-desktop
bash scripts/prepare_export_copy.sh "$work"
for target in "macOS:macos/Stroad Hero.zip" "Windows Desktop:windows/StroadHero.exe" "Linux:linux/StroadHero.x86_64"; do
    out="$PWD/build/${target#*:}"
    mkdir -p "$(dirname "$out")"
    /Applications/Godot.app/Contents/MacOS/Godot --headless --path "$work" --export-release "${target%%:*}" "$out"
done
'''

# =============================================================================
# ITCH.IO & RELEASE
# =============================================================================

[tasks.itch-setup]
description = "Prompt for your itch.io API key and save it to mise.local.toml (git-ignored)"
dir = "{{config_root}}"
raw = true
file = "scripts/itch_setup.sh"

[tasks.itch]
description = "Export desktop builds and push them to itch.io (channels mac, windows, linux); --skip-export pushes existing builds"
dir = "{{config_root}}"
file = "scripts/itch.sh"

[tasks.release]
description = "Check main is pushed, export all platforms, tag HEAD with the next version (patch/minor/major or vX.Y.Z), push the tag and push to itch.io"
dir = "{{config_root}}"
file = "scripts/release.sh"
